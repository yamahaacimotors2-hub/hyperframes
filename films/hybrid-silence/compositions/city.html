<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>City</title>
  </head>
  <body>
    <template id="city">
      <style>
        @font-face {
          font-family: "HF Mono";
          src: url("../fonts/DejaVuSansMono.woff2") format("woff2");
        }
        #city-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: radial-gradient(ellipse at 50% 38%, #0b1830 0%, #050a14 55%, #000 100%);
        }
        #city-bokeh,
        #city-rain {
          position: absolute;
          inset: 0;
        }
        #city-rain {
          height: 3900px;
          top: -1900px;
        }
        .city-dot {
          position: absolute;
          border-radius: 50%;
        }
        .city-drop {
          position: absolute;
          width: 2px;
          background: linear-gradient(to bottom, transparent, rgba(190, 220, 255, 0.35));
        }
        #city-signal {
          position: absolute;
          left: 452px;
          top: 470px;
          width: 176px;
          height: 470px;
          border-radius: 44px;
          background: linear-gradient(180deg, #11151c, #07090d);
          box-shadow:
            inset 0 2px 0 rgba(255, 255, 255, 0.06),
            0 30px 80px rgba(0, 0, 0, 0.8);
        }
        .city-lamp {
          position: absolute;
          left: 30px;
          width: 116px;
          height: 116px;
          border-radius: 50%;
          background: #14171d;
          box-shadow: inset 0 6px 14px rgba(0, 0, 0, 0.8);
        }
        .city-lamp i {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          opacity: 0;
        }
        #city-lamp-red {
          top: 30px;
        }
        #city-lamp-amber {
          top: 177px;
        }
        #city-lamp-green {
          top: 324px;
        }
        #city-lamp-red i {
          background: radial-gradient(circle at 45% 40%, #ffd0c8, #ff3b3b 45%, #8a0d0d 100%);
          box-shadow:
            0 0 60px 18px rgba(255, 59, 59, 0.75),
            0 0 180px 60px rgba(255, 40, 40, 0.35);
        }
        #city-lamp-green i {
          background: radial-gradient(circle at 45% 40%, #d8ffe9, #3dff9a 45%, #0b7a40 100%);
          box-shadow:
            0 0 60px 18px rgba(61, 255, 154, 0.75),
            0 0 180px 60px rgba(61, 255, 154, 0.35);
        }
        .city-refl {
          position: absolute;
          left: 470px;
          top: 1420px;
          width: 140px;
          height: 420px;
          border-radius: 50%;
          filter: blur(28px);
          opacity: 0;
        }
        #city-refl-red {
          background: linear-gradient(to bottom, rgba(255, 59, 59, 0.7), transparent);
        }
        #city-refl-green {
          background: linear-gradient(to bottom, rgba(61, 255, 154, 0.7), transparent);
        }
        #city-ring {
          position: absolute;
          left: 290px;
          top: 455px;
          width: 500px;
          height: 500px;
          overflow: visible;
        }
        #city-engine-off {
          position: absolute;
          left: 0;
          right: 0;
          top: 1080px;
          text-align: center;
          font-family: "HF Mono", monospace;
          font-size: 30px;
          letter-spacing: 10px;
          color: rgba(238, 246, 255, 0.75);
          opacity: 0;
        }
        #city-engine-off b {
          color: #ff3b3b;
          font-weight: 400;
        }
      </style>

      <div id="city-root" data-composition-id="city" data-width="1080" data-height="1920">
        <div id="city-bokeh"></div>
        <div id="city-rain"></div>
        <div id="city-refl-red" class="city-refl"></div>
        <div id="city-refl-green" class="city-refl"></div>
        <div id="city-signal">
          <div id="city-lamp-red" class="city-lamp"><i></i></div>
          <div id="city-lamp-amber" class="city-lamp"><i></i></div>
          <div id="city-lamp-green" class="city-lamp"><i></i></div>
        </div>
        <svg id="city-ring" viewBox="0 0 500 500">
          <circle
            id="city-ring-arc"
            cx="250"
            cy="250"
            r="236"
            fill="none"
            stroke="#36d8ff"
            stroke-width="5"
            stroke-linecap="round"
            stroke-dasharray="1483"
            stroke-dashoffset="1483"
            transform="rotate(-90 250 250)"
          />
        </svg>
        <div id="city-engine-off">ENGINE <b>●</b> RESTING</div>
      </div>

      <script>
        (() => {
          // Seeded PRNG: identical layout in preview and every render.
          let seed = 20261031;
          const rand = () => {
            seed |= 0;
            seed = (seed + 0x6d2b79f5) | 0;
            let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
          const tl = gsap.timeline({ paused: true });

          const bokeh = document.getElementById("city-bokeh");
          const palette = ["255,179,71", "255,77,77", "207,232,255", "255,214,150", "120,200,255"];
          for (let i = 0; i < 46; i++) {
            const d = document.createElement("div");
            const r = 18 + rand() * 80;
            const c = palette[Math.floor(rand() * palette.length)];
            d.className = "city-dot";
            Object.assign(d.style, {
              width: `${r * 2}px`,
              height: `${r * 2}px`,
              left: `${rand() * 1180 - 50}px`,
              top: `${200 + rand() * 1500}px`,
              background: `radial-gradient(circle, rgba(${c},${0.25 + rand() * 0.45}) 0%, rgba(${c},0.08) 60%, transparent 72%)`,
              filter: `blur(${4 + rand() * 14}px)`,
            });
            bokeh.appendChild(d);
            tl.fromTo(d, { x: 0, scale: 0.9 }, { x: (rand() - 0.5) * 120, scale: 1.08, duration: 5, ease: "none" }, 0);
          }
          const rain = document.getElementById("city-rain");
          for (let i = 0; i < 90; i++) {
            const d = document.createElement("div");
            d.className = "city-drop";
            Object.assign(d.style, {
              left: `${rand() * 1128}px`,
              top: `${rand() * 3680}px`,
              height: `${60 + rand() * 120}px`,
              opacity: `${0.2 + rand() * 0.5}`,
              transform: "rotate(12deg)",
            });
            rain.appendChild(d);
          }
          tl.fromTo("#city-rain", { y: 0 }, { y: 1900, duration: 5, ease: "none" }, 0);
          tl.fromTo("#city-root", { opacity: 0.55 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0); // frame 0 is the thumbnail: never start black
          tl.fromTo("#city-signal", { y: 40 }, { y: 0, duration: 5, ease: "power1.out" }, 0);

          // red light comes on
          tl.fromTo("#city-lamp-red i", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 2.4);
          tl.fromTo("#city-refl-red", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 2.45);

          // 5.0 · Stop & Start: the city falls silent
          tl.to(["#city-bokeh", "#city-rain"], { opacity: 0.05, duration: 0.14, ease: "power2.in" }, 5.0);
          tl.fromTo("#city-engine-off", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 5.12);
          // 5.42 · the SMG whir draws the ring, 5.85 red → green
          tl.to("#city-ring-arc", { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.in" }, 5.42);
          tl.to(["#city-lamp-red i", "#city-refl-red"], { opacity: 0, duration: 0.08 }, 5.85);
          tl.fromTo(["#city-lamp-green i", "#city-refl-green"], { opacity: 0 }, { opacity: 1, duration: 0.08 }, 5.86);
          tl.to("#city-engine-off", { opacity: 0, duration: 0.1 }, 5.86);
          tl.to("#city-signal", { scale: 1.12, duration: 0.14, ease: "power2.in" }, 5.86);

          window.__timelines["city"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
