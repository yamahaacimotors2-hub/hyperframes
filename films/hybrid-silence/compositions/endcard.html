<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>End card</title>
  </head>
  <body>
    <template id="endcard">
      <style>
        @font-face {
          font-family: "HF Display";
          src: url("../fonts/InterDisplay-Medium.woff2") format("woff2");
          font-weight: 500;
        }
        @font-face {
          font-family: "HF Display";
          src: url("../fonts/InterDisplay-Black.woff2") format("woff2");
          font-weight: 900;
        }
        #endcard-scrim {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: 760px;
          background: linear-gradient(to bottom, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.45) 60%, transparent);
          opacity: 0;
        }
        #endcard-root {
          position: absolute;
          inset: 0;
          text-align: center;
          color: #eef6ff;
          font-family: "HF Display", sans-serif;
        }
        #endcard-title {
          position: absolute;
          left: 0;
          right: 0;
          top: 120px;
          font-size: 132px;
          font-weight: 900;
          letter-spacing: -4px;
          line-height: 0.95;
          text-shadow: 0 6px 40px rgba(0, 0, 0, 0.8);
        }
        .endcard-row {
          display: block;
        }
        #endcard-row-2 {
          color: #36d8ff;
          text-shadow: 0 0 50px rgba(54, 216, 255, 0.45);
        }
        .endcard-ch {
          display: inline-block;
        }
        #endcard-rule {
          position: absolute;
          left: 390px;
          top: 392px;
          width: 300px;
          height: 3px;
          background: linear-gradient(90deg, transparent, #36d8ff, transparent);
        }
        #endcard-tagline {
          position: absolute;
          left: 0;
          right: 0;
          top: 418px;
          font-size: 46px;
          font-weight: 500;
          letter-spacing: 0.5px;
          text-shadow: 0 4px 30px rgba(0, 0, 0, 0.9);
          opacity: 0;
        }
      </style>

      <div id="endcard-root" data-composition-id="endcard" data-width="1080" data-height="1920">
        <div id="endcard-scrim"></div>
        <div id="endcard-title">
          <span class="endcard-row" id="endcard-row-1"></span>
          <span class="endcard-row" id="endcard-row-2"></span>
        </div>
        <div id="endcard-rule"></div>
        <div id="endcard-tagline">Silence is the new power.</div>
      </div>

      <script>
        (() => {
          // Local time: this card mounts at 20.7 s on the main timeline.
          const tl = gsap.timeline({ paused: true });
          const letters = (id, text) => {
            const row = document.getElementById(id);
            [...text].forEach((c) => {
              const s = document.createElement("span");
              s.className = "endcard-ch";
              s.textContent = c === " " ? "\u00a0" : c; // a bare space collapses inside inline-block
              row.appendChild(s);
            });
            return row.querySelectorAll(".endcard-ch");
          };
          const r1 = letters("endcard-row-1", "FZS FI");
          const r2 = letters("endcard-row-2", "HYBRID");
          tl.fromTo("#endcard-scrim", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
          tl.fromTo(r1, { opacity: 0, y: 60, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, stagger: 0.04, ease: "power3.out" }, 0.15);
          tl.fromTo(r2, { opacity: 0, y: 60, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, stagger: 0.05, ease: "power3.out" }, 0.35);
          tl.fromTo("#endcard-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 0.8);
          tl.fromTo("#endcard-tagline", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.1);
          window.__timelines["endcard"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
